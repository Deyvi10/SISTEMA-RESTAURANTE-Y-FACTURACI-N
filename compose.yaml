# Entorno local de desarrollo (F0-05). Levantar con: make dev
# Todo escucha solo en 127.0.0.1. Las credenciales son de desarrollo y no sirven en ningún otro entorno.
name: restpos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: restpos
      POSTGRES_USER: restpos_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restpos_dev}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-restpos_app_dev}
    ports: ["127.0.0.1:${PG_PORT:-5442}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restpos_owner -d restpos"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3 compatible con Object Lock (sustituye a MinIO, que ya no publica imágenes).
  s3:
    image: versity/versitygw:latest
    entrypoint: ["sh", "-c", "mkdir -p /data/buckets /data/versions && exec versitygw --port :7070 posix --versioning-dir /data/versions /data/buckets"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:-restpos}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:-restpos_s3_dev}
    ports: ["127.0.0.1:${S3_PORT:-7171}:7070"]
    volumes: ["s3data:/data"]

  s3-init:
    image: amazon/aws-cli:latest
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-restpos}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-restpos_s3_dev}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "/init.sh"]
    volumes: ["./deploy/local/s3-init.sh:/init.sh:ro"]
    restart: on-failure

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    ports: ["127.0.0.1:8474:8474"]

  printer-sim:
    build: { context: ., dockerfile: deploy/docker/tools.Dockerfile, args: { TOOL: printer-sim } }
    command: ["-impresoras", "Cocina caliente=:9100,Bar=:9101,Caja=:9102", "-http", ":8090"]
    ports: ["127.0.0.1:8090:8090", "127.0.0.1:9100-9102:9100-9102"]

  sri-stub:
    build: { context: ., dockerfile: deploy/docker/tools.Dockerfile, args: { TOOL: sri-stub } }
    command: ["-addr", ":8091"]
    ports: ["127.0.0.1:8091:8091"]

volumes:
  pgdata:
  s3data:
