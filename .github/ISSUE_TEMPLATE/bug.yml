name: Defecto
description: Algo no funciona como dice el requisito
labels: [bug]
body:
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad (docs/08 §5)
      options:
        - "S1 Crítico: pérdida de datos, comprobante duplicado, fuga entre tenants, caja bloqueada"
        - "S2 Alto: impresión sin reintento, IVA erróneo"
        - "S3 Medio: error con alternativa"
        - "S4 Bajo: cosmético"
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes: { label: Pasos para reproducir }
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes: { label: Qué se esperaba y qué pasó }
    validations: { required: true }
  - type: markdown
    attributes: { value: "No pegues cédulas, correos, contraseñas ni datos de clientes reales." }
